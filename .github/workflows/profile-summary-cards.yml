name: GitHub-Profile-Summary-Cards

on:
  schedule:
    - cron: "0 3 * * *" # daily at 03:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate

    steps:
      - uses: actions/checkout@v4

      # The action wipes its output folder on every run,
      # so the light cards are moved aside before generating the dark ones.
      - name: Generate light cards
        uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.SUMMARY_CARDS_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          THEME: github
          AUTO_PUSH: false

      - run: mv profile-summary-card-output/github "$RUNNER_TEMP/github"

      - name: Generate dark cards
        uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.SUMMARY_CARDS_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          THEME: github_dark
          AUTO_PUSH: false

      - name: Commit cards
        run: |
          mv "$RUNNER_TEMP/github" profile-summary-card-output/github
          # Keep only the cards used in the README
          find profile-summary-card-output -type f ! -name '[012]-*.svg' -delete
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A profile-summary-card-output
          git diff --cached --quiet || { git commit -m "Update profile summary cards" && git push; }
